name: Build CAHighFPS‑RootHide

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
  THEOS_PACKAGE_SCHEME: roothide
  FINALPACKAGE: 1

jobs:
  build:
    name: Build & Verify arm64e
    runs-on: macos‑14
    steps:
      - uses: actions/checkout@v4

      # 核心：预配置好 roothide‑theos 环境，跳过折磨人的 brew install
      - name: Setup RootHide‑Theos
        uses: roothide/theos‑action@v1
        with:
          sdks: iPhoneOS16.5.sdk

      - name: Verify Xcode 15.4
        run: |
          set -euo pipefail
          sudo xcode‑select -s "$DEVELOPER_DIR"
          xcodebuild ‑version
          xcrun clang ‑version | grep "15."

      # 内置 PSHeader（不再网络下载，避免 128/8/9 各种网络坑！）
      # 👉 这里一个重要操作：**你本地项目里把 PSHeader 文件夹放进仓库根目录上传**
      # （只放 .h；不要整个 git 仓库），下面这行就生效；如果不想上传头文件再告诉我
      - name: Set include path
        run: |
          echo 'THEOS_INCPATH += $GITHUB_WORKSPACE/PSHeader' >> Makefile.local
          cat Makefile.local

      - name: Compile tweak
        run: |
          set -euo pipefail
          make clean SDKVERSION=16.5
          make package SDKVERSION=16.5

      - name: Binary arm64e check
        run: |
          set -euo pipefail
          deb=$(find packages ‑name "*.deb" | head ‑n1)
          [[ ‑n "$deb" ]]
          mkdir ‑p /tmp/chk
          dpkg‑deb ‑x "$deb" /tmp/chk
          dylib=$(find /tmp/chk ‑name "CAHighFPS.dylib" | head ‑n1)
          [[ ‑n "$dylib" ]]
          lipo ‑archs "$dylib" | grep ‑q "arm64e"
          xcrun vtool ‑arch arm64e ‑show‑build "$dylib" | grep ‑q "minos 15.0"
          echo "✅ arm64e & minos 15.0 check OK"

      - name: Upload DEB
        uses: actions/upload‑artifact@v4
        with:
          name: CAHighFPS‑roothide
          path: packages/*.deb
