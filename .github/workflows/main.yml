name: Build CAHighFPS Rootless
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos‑Procursus
        uses: theos/theos-action@v1
        with:
          scheme: rootless

      - name: make package
        run: make package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          path: ./packages/*.deb
