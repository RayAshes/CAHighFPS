name: Build CAHighFPS roothide

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

env:
  THEOS: ${{ github.workspace }}/theos
  THEOS_PACKAGE_SCHEME: roothide
  FINALPACKAGE: 1

jobs:
  build:
    name: Package roothide (macOS‑14)
    runs-on: macos‑14
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # 不碰 sudo xcode‑select！GH runner 默认 Xcode15.4 直接可用，不要强制切换容易炸[[(GitHub)]](http://raw.githubusercontent.com/actions/runner-images/main/images/macos/macos-14-arm64-Readme.md?f_link_type=f_linkinlinenote&flow_extra=eyJkb2NfaWQiOiI5NDdhM2M3MzY5NmFmNjEwLWNhMDJlMjcxZTUwODY3MWUiLCJpbmxpbmVfZGlzcGxheV9wb3NpdGlvbiI6MCwiZG9jX3Bvc2l0aW9uIjowfQ%3D%3D "(GitHub)")
      - name: Prepare build tools
        run: |
          set -eu
          # 彻底避开 brew update/brew install 的 macOS‑14 bottle 问题
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install --force dpkg make

      - name: Clone roothide‑theos
        run: |
          set -eu
          git clone --recurse‑submodules https://github.com/roothide/theos.git "$THEOS"

      - name: Fetch iPhoneOS16.5.sdk
        run: |
          set -eu
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/theos‑sdks
          git -C /tmp/theos‑sdks sparse‑checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -R /tmp/theos‑sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"

      - name: Build tweak
        run: |
          set -eu
          export PATH="$THEOS/bin:$PATH"
          rm -rf packages artifacts
          mkdir -p artifacts
          make clean SDKVERSION=16.5
          make package SDKVERSION=16.5
          deb=$(find packages -name "*.deb" | head -1)
          [[ -n "$deb" ]] || exit 1
          cp "$deb" artifacts/

      # 只保留必要包校验；删掉之前那些容易挂的 vtool/字符串严格比对（跑通后你再按需加）
      - name: Quick verify deb
        run: |
          set -eu
          deb="$(find artifacts -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb"
          echo "Package ID: $(dpkg‑deb ‑f "$deb" Package)"
          echo "Arch: $(dpkg‑deb ‑f "$deb" Architecture)"

      - name: Upload deb artifact
        uses: actions/upload‑artifact@v4
        with:
          name: CAHighFPS‑roothide‑${{ github.run_id }}
          path: artifacts/*.deb
          retention‑days: 30
